info:
  name: HealthCheck
  type: http
  seq: 1

http:
  method: GET
  url: "{{server_base_url}}/health-check"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.status
      operator: eq
      value: "ok"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
