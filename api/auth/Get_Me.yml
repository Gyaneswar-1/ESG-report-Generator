info:
  name: Get_Me
  type: http
  seq: 4

http:
  method: GET
  url: "{{server_base_url}}/auth/me"
  headers:
    - name: Authorization
      value: "Bearer {{cso_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.role
      operator: eq
      value: "executive"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
