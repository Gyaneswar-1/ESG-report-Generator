info:
  name: Get_Pending_Approvals
  type: http
  seq: 5

http:
  method: GET
  url: "{{server_base_url}}/auth/pending-approvals"
  headers:
    - name: Authorization
      value: "Bearer {{cso_token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
