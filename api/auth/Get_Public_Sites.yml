info:
  name: Get_Public_Sites
  type: http
  seq: 2

http:
  method: GET
  url: "{{server_base_url}}/auth/public/sites"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
