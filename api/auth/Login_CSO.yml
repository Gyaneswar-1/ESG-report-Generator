info:
  name: Login_CSO
  type: http
  seq: 1

http:
  method: POST
  url: "{{server_base_url}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{cso_email}}",
        "password": "{{cso_password}}",
        "role": "executive"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.user.role
      operator: eq
      value: "executive"
    - expression: res.body.data.user.isApproved
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
